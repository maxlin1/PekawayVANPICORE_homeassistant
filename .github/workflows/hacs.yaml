name: Validate with HACS

on:
  push:
  pull_request:
  schedule:
    - cron: "0 0 * * *"
  workflow_dispatch:

jobs:
  validate:
    runs-on: "ubuntu-latest"
    steps:
      - uses: "hacs/action@main"
        with:
          category: "integration"
          # Brands und Topics setzt der Repo-Inhaber; bis dahin nicht als Fehler werten.
          ignore: "brands topics"
